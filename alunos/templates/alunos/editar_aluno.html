{% extends 'base.html' %}

{% block content %}


<h2 class="mb-4">Editar Aluno</h2>

<form method="POST" class="card p-4 shadow">
    {% csrf_token %}
    
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Salvar
    </button>
</form>

<a href="{% url 'lista_alunos' %}" class="btn btn-secondary mt-3">
    Voltar
</a>
{% endblock %}
