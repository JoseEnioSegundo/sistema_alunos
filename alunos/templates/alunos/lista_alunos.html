{% extends 'alunos/base.html' %}

{% block content %}

<h2>Lista de Alunos</h2>

<ul>
    {% for aluno in alunos %}
        <li>
            <strong>{{ aluno.nome }}</strong> - {{ aluno.curso }}
        </li>
    {% empty %}
        <li>Nenhum aluno cadastrado.</li>
    {% endfor %}
</ul>

{% endblock %}
