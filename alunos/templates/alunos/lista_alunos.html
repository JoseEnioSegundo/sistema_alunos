{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Lista de Alunos</h2>

<a href="{% url 'cadastrar_aluno' %}" class="btn btn-primary mb-3">
    Cadastrar Novo Aluno
</a>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Nome</th>
            <th>Curso</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>
        {% for aluno in alunos %}
        <tr>
            <td>{{ aluno.nome }}</td>
            <td>{{ aluno.curso }}</td>
            <td>
                <a href="{% url 'editar_aluno' aluno.id %}" class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a href="{% url 'excluir_aluno' aluno.id %}" class="btn btn-danger btn-sm">
                    Excluir
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Nenhum aluno cadastrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
